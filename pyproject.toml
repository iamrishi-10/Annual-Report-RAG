[project]
name = "annual-report-rag"
version = "0.1.0"
description = "RAG pipeline for querying corporate annual reports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==1.3.14",
    "langchain-community==0.4.1",
    "langchain-openai==1.4.1",
    "langchain-text-splitters==1.1.2",
    "openai==2.50.0",
    "tiktoken==0.13.0",
    "pymupdf==1.28.0",
    "pdfplumber==0.11.10",
    "pinecone==7.3.0",
    "langchain-pinecone==0.2.13",
    "langchain-cohere==0.6.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "ragas==0.4.3",
    "datasets>=4.0.0",
    "rich==14.3.4",
    "tqdm>=4.67.0",
    "gradio>=6.22.0",
    "langsmith==0.10.12",
    "pytest==9.1.1",
    "ruff>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
